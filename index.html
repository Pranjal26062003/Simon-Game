<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Simon Says Game</h1>
        <!-- <h2>Press Any key to start the Game</h2> -->

        <div class="game-info">
            <h2 id="status">Press Any Key to Start</h2>
            <div class="score-board">
                <p>Level: <span id="level">0</span></p>
                <p>High Score: <span id="high-score">0</span></p>
            </div>
        </div>

        <button id="start-btn" class="start-btn">Start Game</button>
        
        <div class="btn-container">
            <div class="row">
                <button class="btn red" id="red" aria-label="Red Button"></button>
                <button class="btn yellow" id="yellow" aria-label="Yellow Button"></button>
            </div>

            <div class="row">
                <button class="btn green" id="green" aria-label="Green Button"></button>
                <button class="btn purple" id="purple" aria-label="Purple Button"></button>
            </div>
        </div>

        <div class="instructions">
            <p>Repeat the sequence shown by Simon.</p>
        </div>
    </main>

    <script src="app.js"></script>

</body>
</html>
